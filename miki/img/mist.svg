<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" preserveAspectRatio="none">
  <defs>
    <!-- Static fractal texture: only the composited image moves in the browser. -->
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".003 .014" numOctaves="4" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .65  0 0 0 0 .73  0 0 0 0 .67  .7 .7 .7 0 -.78"/>
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- Fade only vertically, so every mist layer continues beyond both page edges. -->
    <linearGradient id="falloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".28" stop-color="white" stop-opacity=".85"/>
      <stop offset=".5" stop-color="white"/>
      <stop offset=".72" stop-color="white" stop-opacity=".85"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><path d="M0 0h1440v520H0z" fill="url(#falloff)"/></mask>
  </defs>
  <g mask="url(#edges)"><path d="M0 0h1440v520H0z" filter="url(#cloud)"/></g>
</svg>
